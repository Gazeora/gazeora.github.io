# Publishes the site. A release in Gazeora/Gazeora or Gazeora/Gazeora-Android arrives here as
# a repository_dispatch event (sent by .github/actions/publish-release), is saved into
# data/releases/ (and the platform's latest release's docs into data/docs/<platform>/) and committed,
# and the site is deployed with it. Visitors read those files, never the GitHub API.
name: Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [release]
  workflow_dispatch:

permissions:
  contents: read

# One at a time, in order, so two releases at once can't overwrite each other's files
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  save-release:
    name: Save the release
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Update data/releases
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          printf '%s' "$PAYLOAD" > "$RUNNER_TEMP/payload.json"
          python3 .github/scripts/release_data.py dispatch "$RUNNER_TEMP/payload.json"

      # The docs follow each platform's latest release, so unreleased work on master stays off the site
      - name: Update data/docs
        env:
          PLATFORM: ${{ github.event.client_payload.platform }}
        run: python3 .github/scripts/docs_data.py "$PLATFORM"

      # Pushed with the workflow's own token, which doesn't start this workflow again
      - name: Commit the release lists
        env:
          SOURCE_REPO: ${{ github.event.client_payload.repo }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/releases data/docs
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "chore: update releases from $SOURCE_REPO"
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin main && git push --quiet origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

  deploy:
    name: Deploy
    needs: save-release
    # Runs after a saved release, and on its own for a push or by hand
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: main  # includes the commit save-release just pushed

      - name: Gather the site
        run: |
          mkdir site
          cp -r index.html download.html docs.html favicon.ico .nojekyll assets data site/

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
