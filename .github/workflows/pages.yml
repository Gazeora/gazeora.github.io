# Publishes the site with the Gazeora release lists baked in as data/releases/*.json, so
# visitors read them from the site instead of the GitHub API, which allows each visitor's
# network only 60 requests an hour. The lists refresh every 15 minutes and on every push.
name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # A repository that isn't public (or has no releases) gives an empty list. On any other
      # failure the file is left out and the page asks the GitHub API itself.
      - name: Fetch the release lists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/data/releases
          cp -r index.html download.html docs.html favicon.ico assets .nojekyll site/
          fetch() {
            local id=$1 repo=$2 out=site/data/releases/$1.json raw
            if raw=$(gh api --paginate "repos/$repo/releases?per_page=100" 2>err.txt); then
              :
            elif grep -q "HTTP 404" err.txt; then
              raw="[]"
            else
              echo "::warning::$repo: $(cat err.txt)"
              return 0
            fi
            echo "$raw" | jq -s --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{
              generated_at: $at,
              releases: [add // [] | .[] | select(.draft | not) | {
                tag_name, name, prerelease, draft, published_at, html_url, body,
                assets: [.assets[] | {name, size, download_count, browser_download_url, digest}]
              }]
            }' > "$out"
            echo "$repo: $(jq '.releases | length' "$out") releases"
          }
          fetch windows Gazeora/Gazeora
          fetch android Gazeora/Gazeora-Android

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
